version: 2
sources:
  - name: raw_src # this is the source_name
    database: sales_db
    schema: raw_schema
    tables:
      - name: raw_orders 
        columns:
          - name: id
            data_tests:
              - unique:
                 config:
                  severity: warn
              - not_null:
                 config:
                  severity: error
          - name: product_id
            data_tests:
              - unique :
                 config:
                  severity: warn
   
      - name: raw_products  
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

                 

      - name: orders_status
      - name: raw_payments

      - name: transactions 
      - name: raw_reviews 
      - name: raw_users 
      - name: raw_customers # this is the table_name 
      - name: emp                 # Logical name used in dbt
        identifier: employees     # Physical table name in DB





  - name: raw_sf # this is the source_name
    database: snowflake_sample_data
    schema: tpch_sf1
    tables:
      - name: nation 